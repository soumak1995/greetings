<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>For Ankita 🪔 — Our Story</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>

    <!-- Netlify Forms: static shell so Netlify registers the form -->
    <form
      name="ankita-reply"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="ankita-reply" />
      <input type="text" name="step" />
      <input type="text" name="answer" />
      <input type="text" name="at" />
      <input type="text" name="device" />
    </form>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
